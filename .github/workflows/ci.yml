name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: PYTHONPATH=. python -c "from altavela.config import MODEL_MAP, MODEL_PROVIDER; from altavela.llm import LLMError; from altavela.ledger.store import init as store_init; store_init(); print('OK:', MODEL_PROVIDER)"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: "10.12.1"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm install
      - run: pnpm build

  deploy:
    name: Deploy to GCP
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: "10.12.1"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - name: Build UI
        run: cd ui && pnpm install && pnpm build
      - name: Deploy to VM
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.GCP_VM_IP }}
          username: vignesh
          key: ${{ secrets.GCP_SSH_KEY }}
          script: |
            set -e
            if [ ! -d /opt/altavela ]; then
              sudo git clone https://github.com/vigneshv1cky/Altavela.git /opt/altavela
            fi
            cd /opt/altavela
            sudo git fetch origin main
            sudo git reset --hard origin/main
            sudo pip install -r requirements.txt
            sudo systemctl restart altavela
            echo "Backend deployed — altavela restarted"
            sudo journalctl -u altavela --no-pager -n 3
      - name: Deploy UI
        uses: appleboy/scp-action@v0
        with:
          host: ${{ secrets.GCP_VM_IP }}
          username: vignesh
          key: ${{ secrets.GCP_SSH_KEY }}
          source: "app/static/*"
          target: "/tmp/static-upload"
          strip_components: 1
          rm: true
      - name: Reload UI
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.GCP_VM_IP }}
          username: vignesh
          key: ${{ secrets.GCP_SSH_KEY }}
          script: |
            sudo rm -rf /opt/altavela/app/static/assets /opt/altavela/app/static/index.html
            sudo cp -r /tmp/static-upload/* /opt/altavela/app/static/
            sudo systemctl restart altavela
            echo "UI deployed"
